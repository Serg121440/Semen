defaults:
  target_stock_days: 30
  shelf_life_days: 365
  velocity_window_days: 28
  min_velocity_window_days: 14
  critical_days_threshold: 7
  lead_time_days: 14

shipping:
  preferred_weekday: friday    # отгрузка
  request_weekday: monday      # формирование заявки
  weeks_ahead: 2               # на сколько недель вперёд

ip_accounts:
  sergashov:
    enabled: true
    auto_mode: false
    api_keys_env_prefix: OZON_SERGASHOV
  lebedev:
    enabled: false
    auto_mode: false
    api_keys_env_prefix: OZON_LEBEDEV

# Маппинг склад_Ozon → кластер (из листа «Маппинг_складов» таблицы)
# Источник: лист «Склады получатели WB/OZON», колонки C (склад Ozon) → B (кластер)
warehouse_clusters:
  "МО Гривно РФЦ": "Москва-Восток и Дальние регионы"
  "МО Гривно РФЦ Негабарит": "Москва-Запад"
  "МО Давыдовское РФЦ Негабарит": "Санкт-Петербург и СЗО"
  "МО Домодедово РФЦ": "Поволжье"
  "МО Павловская Слобода РФЦ Негабарит": "Дон"
  "МО Петровское РФЦ": "Урал"
  "МО Хоругвино РФЦ": "Сибирь"
  "МО Хоругвино РФЦ Негабарит": "Юг"
  "МО Радумля РФЦ Негабарит": "Дальний Восток"
  "МО Софьино РФЦ": "Калининград"
  "МО Жуковский РФЦ": "Казахстан"
  "МО Ногинск РФЦ": "Беларусь"
  "МО Ногинск РФЦ Негабарит": "Кыргызстан"
  "МО Пушкино-1 РФЦ": "Армения"

# Маппинг кластер доставки → название склада Ozon (для API создания поставки)
# Получить актуальные имена складов: python -m src.main --collect (смотри лог warehouses)
# Или: from src.ozon_api import OzonClient; client.get_warehouses()
cluster_warehouses:
  "Москва-Восток и Дальние регионы": "МО Гривно РФЦ"
  "Москва-Запад":                    "МО Гривно РФЦ Негабарит"
  "Санкт-Петербург и СЗО":           "МО Давыдовское РФЦ Негабарит"
  "Поволжье":                        "МО Домодедово РФЦ"
  "Дон":                             "МО Павловская Слобода РФЦ Негабарит"
  "Урал":                            "МО Петровское РФЦ"
  "Сибирь":                          "МО Хоругвино РФЦ"
  "Юг":                              "МО Хоругвино РФЦ Негабарит"
  "Дальний Восток":                  "МО Радумля РФЦ Негабарит"

# BOM (Bill of Materials) для составных товаров.
# Ключ — название товара в 1С (Готовая Продукция или как в каталоге Название_цех).
# Значение — словарь {компонент_в_1С: кг_на_1_штуку}.
# Компоненты берутся из сырьевых складов НУТТРЕЙД суммарно.
bom:
  # ── Составные (штучная фасовка, несколько компонентов) ──────────────────
  "Арахис в корочке ассорти, 300гр озон":
    "Арахис в хрустящей корочке со вкусом Бекон": 0.1
    "Арахис в хрустящей корочке со вкусом Сыр": 0.1
    "Арахис в хрустящей корочке со вкусом Васаби": 0.1
  "Смесь с нутом и кукурузой, 150гр озон":
    "Нут жареный": 0.075
    "Кукуруза жареная солёная (Испания)": 0.075

  # ── Весовая продукция 1000г (1 шт = 1 кг соответствующего компонента) ──
  # Ключи совпадают с Название_цех в каталоге (Google Sheet)
  "арахис барбекю весовой":
    "Арахис в хрустящей корочке со вкусом Барбекю": 1.0
  "арахис васаби весовой":
    "Арахис в хрустящей корочке со вкусом Васаби": 1.0
  "арахис сырный весовой":
    "Арахис в хрустящей корочке со вкусом Сыр": 0.5

  # ── Весовые 1000г из сырьевых запасов ──────────────────────────────────
  "Арахис жар сол 1000":
    "Арахис жареный соленый": 1.0
  "Миндаль жар сол 1000":
    "Миндаль жареный соленый": 1.0
  "Фисташки жар сол 1000":
    "Фисташки жареные соленые": 1.0
  "пекан 1000":
    "Орех Пекан": 1.0
